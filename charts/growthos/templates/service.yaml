apiVersion: v1
kind: Service
metadata:
  name: {{ include "growthos.name" . }}
  labels: {{- include "growthos.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
