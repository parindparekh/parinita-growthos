{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "growthos.name" . }}-postgresql
spec:
  clusterIP: None
  ports: [{name: postgres, port: 5432}]
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "growthos.name" . }}-postgresql
spec:
  serviceName: {{ include "growthos.name" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image | quote }}
          securityContext: {{- include "growthos.security" . | nindent 12 }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgresql.existingSecret with POSTGRES_PASSWORD is required" .Values.postgresql.existingSecret }}
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          startupProbe:
            tcpSocket: {port: postgres}
            failureThreshold: 60
            periodSeconds: 5
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgresql.storageClass }}
        storageClassName: {{ .Values.postgresql.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgresql.size }}}
{{- end }}
