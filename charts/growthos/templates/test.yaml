apiVersion: v1
kind: Pod
metadata:
  name: {{ include "growthos.name" . }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: health
      image: {{ include "growthos.image" . | quote }}
      securityContext: {{- include "growthos.security" . | nindent 8 }}
      command: [python, -c]
      args:
        - >-
          import urllib.request;
          base='http://{{ include "growthos.name" . }}:{{ .Values.service.port }}';
          assert urllib.request.urlopen(base+'/health',timeout=10).status == 200;
          assert urllib.request.urlopen(base+'/console',timeout=10).status == 200;
          print('Database readiness and console HTTP checks passed')
