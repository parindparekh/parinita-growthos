name: GrowthOS release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - run: python scripts/validate_chart.py
      - run: helm package charts/growthos --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: growthos-helm-chart
          path: dist/*.tgz
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: growthos
          POSTGRES_PASSWORD: ci-only-isolated-password
          POSTGRES_DB: growthos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U growthos -d growthos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - name: Run SQLite suite
        if: matrix.database == 'sqlite'
        run: python -m pytest -q -rs --junitxml=evidence/ci-sqlite.xml
      - name: Run PostgreSQL suite
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://growthos:ci-only-isolated-password@localhost:5432/growthos_test
        run: python -m pytest -q -rs --junitxml=evidence/ci-postgres.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.database }}
          path: evidence/ci-*.xml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable configuration
        run: |
          python - <<'PYCODE'
          import pathlib, secrets
          text = pathlib.Path(".env.example").read_text()
          text = text.replace("ENVIRONMENT=development", "ENVIRONMENT=production")
          text = text.replace("PUBLIC_BASE_URL=http://localhost:8080", "PUBLIC_BASE_URL=https://growthos.example.com")
          while "__GENERATE__" in text:
              text = text.replace("__GENERATE__", secrets.token_hex(24), 1)
          pathlib.Path(".env").write_text(text)
          PYCODE
      - run: docker compose config --quiet
      - run: docker build -t growthos:test .
      - name: Boot API, PostgreSQL and worker with production configuration
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify runtime and authentication boundary
        run: |
          python - <<'PYCODE'
          import json, urllib.request, urllib.error
          for path in ('/live', '/health', '/console'):
              assert urllib.request.urlopen('http://127.0.0.1:8080' + path, timeout=10).status == 200
          try:
              urllib.request.urlopen('http://127.0.0.1:8080/v1/connectors', timeout=10)
              raise AssertionError('Connector inventory must require authentication')
          except urllib.error.HTTPError as error:
              assert error.code == 401
          PYCODE
      - name: Verify real 15-second video rendering in the production image
        run: |
          docker compose exec -T api python - <<'PYCODE'
          import json, pathlib, subprocess, tempfile
          from app.short_video import render_short_video
          with tempfile.TemporaryDirectory() as folder:
              path = pathlib.Path(folder) / "test.mp4"
              path.write_bytes(render_short_video({"title":"Synthetic release", "summary":"Container video rendering acceptance check"}))
              result = subprocess.check_output(["ffprobe", "-v", "error", "-show_format", "-show_streams", "-of", "json", str(path)])
              metadata = json.loads(result)
              stream = next(s for s in metadata["streams"] if s["codec_type"] == "video")
              assert stream["codec_name"] == "h264"
              assert (stream["width"], stream["height"]) == (720, 1280)
              assert abs(float(metadata["format"]["duration"]) - 15) < 0.05
          PYCODE
      - name: Stop disposable runtime
        if: always()
        run: docker compose down --volumes
