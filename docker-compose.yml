# Secrets come from .env (generated by deploy.sh / single-click.ps1). Nothing is hardcoded here.
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: growthos
      POSTGRES_USER: growthos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (run ./deploy.sh)}
    volumes:
      - growthos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthos -d growthos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # No published port: the database is reachable only on the compose network.

  api:
    <<: *hardening
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://growthos:${POSTGRES_PASSWORD}@db:5432/growthos
      # uvicorn reads this directly: which proxy addresses may set X-Forwarded-For/Proto (see .env.example).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - growthos_media:/media     # audio rendered through Vaak; the rest of the filesystem stays read-only
    ports:
      # Loopback by default. Terminate TLS in a reverse proxy; set BIND_ADDR only if you know why.
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *hardening
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://growthos:${POSTGRES_PASSWORD}@db:5432/growthos
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy   # the API owns schema creation; the worker never races it

volumes:
  growthos_pg:
  growthos_media:
